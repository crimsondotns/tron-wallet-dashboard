name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Served at https://crimsondotns.github.io/xcap-insight/
      NEXT_PUBLIC_BASE_PATH: /xcap-insight
      # Public by design: both ship in the browser bundle. Access control is RLS in Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ogriabewnhlodvteofek.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aUF1qdXRu5XKkmoHUEQu_A_wARxM15Q
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # _next/ starts with an underscore; without this file Jekyll would drop it.
      - run: touch apps/web/out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
